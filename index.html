<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Art Kids in Politics — A student podcast</title><link data-keep="1" rel="preconnect" href="https://fonts.googleapis.com"><link data-keep="1" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"><style id="design">
/* DESIGN ONLY. Layout concept: dark editorial podcast site, hairline-ruled sections, italic serif numerals.
   All words, links, images and episodes live in the JSON block (#content) below, never in this stylesheet. */
:root{--bg:#141211;--bg2:#1c1917;--ink:#ece4d3;--mute:#a79c8a;--brown:#6b5545;--wine:#8a3342;--moss:#3f5e4b;--rose:#d49aa4;--prose:#cfc6b4;--trans:#d8cfbd;--line:rgba(236,228,211,.16);
--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.02;margin:0;letter-spacing:-.01em;text-wrap:balance}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.eyebrow{font:600 11px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.eyebrow.w{color:var(--rose)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(20,18,17,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.logo{font:600 19px/1 var(--serif);text-decoration:none;letter-spacing:.14em;text-transform:uppercase}
.logo i{color:var(--rose);font-style:normal}
nav{display:flex;gap:22px;overflow-x:auto}
nav a{font:500 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--mute);padding:6px 0;border-bottom:1px solid transparent;white-space:nowrap}
nav a:hover,nav a.on{color:var(--ink);border-color:var(--wine)}
.btn{display:inline-block;font:600 12px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;text-decoration:none;padding:16px 26px;border:1px solid var(--ink);cursor:pointer;background:none;color:var(--ink)}
.btn.fill{background:var(--ink);color:var(--bg)}
.btn.wine{background:var(--wine);border-color:var(--wine)}
.btn.sm{padding:12px 18px}
.btn:hover{opacity:.85}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
section{padding:84px 0;border-top:1px solid var(--line)}
.hero{border:0;padding:96px 0 80px}
.hero h1{font-size:clamp(52px,12vw,150px);text-transform:uppercase;letter-spacing:-.02em;margin:22px 0}
.hero h1 em{font-style:italic;text-transform:none;color:var(--rose)}
.tag{font:italic 400 clamp(22px,3.4vw,32px)/1.3 var(--serif);max-width:640px}
.intro{max-width:520px;color:var(--mute);margin-top:18px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:40px;gap:16px;flex-wrap:wrap}
.sh h2{font-size:clamp(34px,5vw,56px);text-transform:uppercase}
.sh a{font:600 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.latest{display:grid;grid-template-columns:1fr 1.3fr;gap:48px;align-items:center}
.num{font:italic 500 clamp(110px,22vw,260px)/.8 var(--serif);color:var(--wine);opacity:.9}
.latest h3{font-size:clamp(30px,4.4vw,48px);margin:14px 0 18px}
.meta{font-size:13px;color:var(--mute);letter-spacing:.04em}
.about2{display:grid;grid-template-columns:1fr 1.4fr;gap:48px}
.about2 p,.prose p{color:var(--prose);margin:0 0 18px;font-size:17px}
.pull{font:italic 500 clamp(26px,3.6vw,38px)/1.2 var(--serif);border-left:2px solid var(--moss);padding-left:22px}
.row{display:grid;grid-template-columns:90px 1fr auto;gap:24px;padding:28px 0;border-top:1px solid var(--line);text-decoration:none;align-items:start}
.row:last-child{border-bottom:1px solid var(--line)}
.row .n{font:italic 500 54px/.9 var(--serif);color:var(--brown)}
.row h3{font-size:clamp(24px,3vw,34px);transition:color .2s}
.row:hover h3{color:var(--rose)}
.row p{margin:8px 0 0;color:var(--mute);max-width:620px;font-size:15px}
.row .meta{text-align:right;min-width:110px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;padding:11px 16px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;text-decoration:none}
.chip:hover,.chip.on{background:var(--moss);border-color:var(--moss)}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-top:1px solid var(--line)}
.topics a{padding:34px 18px 34px 18px;text-decoration:none;border-right:1px solid var(--line)}
.topics a:first-child{padding-left:0}.topics a:last-child{border-right:0}
.topics h3{font-size:34px;font-style:italic}.topics a:hover h3{color:var(--rose)}
.topics span{font-size:13px;color:var(--mute)}
.hosts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:40px}
.arch{aspect-ratio:3/4;max-width:100%;border-radius:999px 999px 0 0;background:linear-gradient(180deg,var(--bg2),var(--brown));display:flex;align-items:flex-end;justify-content:center;font:italic 500 90px/1 var(--serif);color:rgba(236,228,211,.35);overflow:hidden;margin-bottom:20px}
.arch img{width:100%;height:100%;object-fit:cover}
.hosts h3{font-size:32px}.role{margin:6px 0 12px}
.hosts p{color:var(--mute);font-size:15px;margin:0}
.hostlist .arch{max-width:300px}
.hostlist .h{display:grid;grid-template-columns:300px 1fr;gap:48px;padding:48px 0;border-top:1px solid var(--line);align-items:end}
.page-h{padding:72px 0 40px}.page-h h1{font-size:clamp(46px,9vw,110px);text-transform:uppercase}
.ep-h h1{font-size:clamp(38px,7vw,88px);margin:18px 0 24px;max-width:900px}
.player{border:1px solid var(--line);padding:22px;margin:32px 0;background:var(--bg2)}
.player audio{width:100%;margin-top:14px}
.ep-cols{display:grid;grid-template-columns:1.8fr 1fr;gap:64px}
.transcript{border-top:1px solid var(--line);padding-top:28px;min-width:0}
.transcript p{max-width:640px;color:var(--trans);font-size:18px}
.transcript b{display:block;font:600 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--rose);margin:26px 0 8px}
.side{min-width:0}
.side h4{font:600 11px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin:0 0 14px}
.side>div{margin-bottom:36px}
.ph{color:var(--mute);font-size:13px;font-style:italic}
footer{border-top:1px solid var(--line);padding:56px 0 48px;background:var(--bg2)}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;font-size:14px;color:var(--mute)}
.fgrid>*{min-width:0;overflow-wrap:anywhere}
.fgrid h5{font:600 11px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--ink);margin:0 0 14px}
.fgrid a{display:block;text-decoration:none;padding:3px 0}.fgrid a:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.art{display:block;width:100%;height:auto;border:1px solid var(--line)}
@media(max-width:760px){
.latest,.about2,.ep-cols,.hostlist .h{grid-template-columns:1fr;gap:28px}
.topics{grid-template-columns:1fr 1fr}.topics a{border-bottom:1px solid var(--line);padding-left:0}
.row{grid-template-columns:56px 1fr}.row .n{font-size:38px}.row .meta{grid-column:2;text-align:left}
.fgrid{grid-template-columns:1fr 1fr}.nav{flex-direction:column;height:auto;padding:12px 0;gap:10px}
section{padding:56px 0}.hero{padding:56px 0}}

/* ---------- EDITOR (only appears for the site owner) ---------- */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--wine);border-color:var(--wine)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--bg2);border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.bar .eyebrow{flex:1 1 100%;text-align:center;color:var(--rose)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;max-width:min(560px,calc(100% - 32px));background:var(--ink);color:var(--bg);padding:14px 18px;font-size:14px;line-height:1.4}
.ed{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ed[hidden]{display:none}
.edtop{position:sticky;top:0;z-index:2;background:rgba(20,18,17,.97);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.edbody{max-width:760px;margin:0 auto;padding:32px 16px 140px}
.edbody h2{font-size:40px;margin-bottom:8px}
.edbody .lead{color:var(--mute);font-size:15px;margin:0 0 28px}
.fl{display:block;margin:0 0 20px}
.fl>span{display:block;font:600 11px/1.3 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.fl input[type=text],.fl input[type=date],.fl textarea{width:100%;background:var(--bg2);color:var(--ink);border:1px solid var(--line);padding:12px 14px;font:400 16px/1.5 var(--sans);border-radius:0}
.fl input[type=file]{width:100%;color:var(--mute);font-size:14px}
.fl small{display:block;color:var(--mute);font-size:12px;margin-top:6px}
.fl img{display:block;max-width:180px;max-height:180px;margin:0 0 10px;border:1px solid var(--line)}
.card{border:1px solid var(--line);padding:20px;margin:0 0 20px;background:var(--bg2)}
.card .fl input[type=text],.card .fl input[type=date],.card .fl textarea{background:var(--bg)}
.card>summary{cursor:pointer;font:500 26px/1.2 var(--serif)}
.card>summary small{font:400 13px/1 var(--sans);color:var(--mute);margin-left:10px}
details.card[open]>summary{margin-bottom:22px}
.chk{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);padding:9px 12px;margin:0 8px 8px 0;font-size:14px;cursor:pointer}
.chk input{accent-color:var(--moss)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.chip.danger:hover{background:var(--wine);border-color:var(--wine)}
.note{border:1px solid var(--line);padding:14px 16px;color:var(--mute);font-size:14px;margin:0 0 28px}

(function(){
'use strict';
const DATA = JSON.parse(document.getElementById('content').textContent);
let C = JSON.parse(JSON.stringify(DATA));
let EP = [], canEdit = false, mode = 'site', tab = 'show', openEp = null, dirty = false, busy = false, toastT = null;
const root = document.getElementById('root');

const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const lnk = u => esc(u||'#');
const slugify = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const fmt = d => new Date(String(d).slice(0,10)+'T12:00:00').toLocaleDateString('en-ZA',{day:'numeric',month:'long',year:'numeric'});
const parseT = t => String(t||'').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean).map(p=>{const m=p.match(/^([^:\n]{1,40}):\s*([\s\S]+)$/);return m?[m[1],m[2]]:['',p]});
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

/* title with one italic word, e.g. "Art Kids [in] Politics" */
function brand(tag){
  const t = C.show.title||'', a = C.show.accent||'';
  const i = a ? t.toLowerCase().indexOf(' '+a.toLowerCase()+' ') : -1;
  if(i<0) return esc(t);
  return esc(t.slice(0,i))+' <'+tag+'>'+esc(t.slice(i+1,i+1+a.length))+'</'+tag+'> '+esc(t.slice(i+a.length+2));
}

function derive(){
  const raw = (C.episodes||[]).filter(e=>e&&e.title&&e.date).map((e,i)=>Object.assign({},e,{_i:i}));
  raw.sort((a,b)=>String(a.date).localeCompare(String(b.date))||a._i-b._i);
  const seen = {};
  raw.forEach((e,i)=>{
    e.n = String(i+1).padStart(2,'0');
    let s = slugify(e.title)||('episode-'+e.n); if(seen[s]) s += '-'+e.n; seen[s]=1; e.slug = s;
    e.full = e.full||e.title; e.desc = e.desc||''; e.people = e.people||[]; e.topics = e.topics||[];
    e.tr = parseT(e.transcript);
  });
  EP = raw.reverse();
}

/* ---------------- site views ---------------- */
const btns = e => { const l = e.listen||C.show.spotify; return `<div class="btns">${l&&l!=='#'?`<a class="btn fill" href="${lnk(l)}">Listen now</a>`:''}${e.watch?`<a class="btn" href="${lnk(e.watch)}">Watch</a>`:''}</div>`; };
const row = e => `<a class="row" href="#/episode/${e.slug}"><div class="n">${e.n}</div><div><div class="eyebrow">${e.topics.map(esc).join(' · ')}</div><h3 style="margin-top:10px">${esc(e.title)}</h3><p>${esc(e.desc)}</p></div><div class="meta">${fmt(e.date)}<br>${e.people.map(esc).join(', ')}</div></a>`;
const host = h => `<div><div class="arch">${h.photo?`<img src="${esc(h.photo)}" alt="${esc(h.name)}">`:esc((h.name||'?')[0])}</div><h3>${esc(h.name)}</h3><div class="eyebrow role">${esc(h.role)}</div><p>${esc(h.bio)}</p></div>`;
const topicLinks = () => C.topics.map(t=>`<a href="#/episodes/${encodeURIComponent(t.name)}"><h3>${esc(t.name)}</h3><span>${esc(t.desc)}</span></a>`).join('');

function home(){
  const PG = C.pages, S = C.show, l = EP[0];
  const latest = l ? `<section><div class="wrap"><div class="latest">${l.artwork?`<img class="art" src="${esc(l.artwork)}" alt="${esc(l.title)}">`:`<div class="num">${l.n}</div>`}<div>
  <div class="eyebrow w">Latest episode</div><h3>${esc(l.full)}</h3><p>${esc(l.desc)}</p>
  <div class="meta">${fmt(l.date)} &nbsp;·&nbsp; ${l.people.map(esc).join(', ')}</div>${btns(l)}
  <div class="btns" style="margin-top:12px"><a class="chip" href="#/episode/${l.slug}">Read transcript →</a></div></div></div></div></section>` : '';
  return `<div class="wrap hero"><div class="eyebrow">A student podcast</div>
  <h1>${brand('em')}</h1><div class="tag">${esc(S.tagline)}</div><p class="intro">${esc(S.intro)}</p>
  <div class="btns"><a class="btn fill" href="${lnk(S.spotify)}">Listen now</a><a class="btn" href="${lnk(S.youtube)}">Watch</a></div></div>
  ${latest}
  <section><div class="wrap about2"><div><div class="eyebrow">About the podcast</div><h2 style="font-size:44px;margin-top:16px">${esc(PG.homeAboutHeading)} <i>${esc(PG.homeAboutItalic)}</i></h2></div>
  <div class="prose"><p>${esc(PG.homeAboutP1)}</p><p>${esc(PG.homeAboutP2)}</p><a class="chip" href="#/about">Read more</a></div></div></section>
  <section><div class="wrap"><div class="sh"><h2>Explore episodes</h2><a href="#/episodes">All episodes →</a></div>${EP.slice(0,4).map(row).join('')}</div></section>
  <section><div class="wrap"><div class="sh"><h2>Topics</h2></div><div class="topics">${topicLinks()}</div></div></section>
  <section><div class="wrap"><div class="sh"><h2>Meet the hosts</h2><a href="#/hosts">Full profiles →</a></div><div class="hosts">${C.hosts.map(host).join('')}</div></div></section>`;
}
function episodes(topic){
  const list = topic ? EP.filter(e=>e.topics.includes(topic)) : EP;
  return `<div class="wrap page-h"><div class="eyebrow">The archive</div><h1>Episodes</h1></div>
  <div class="wrap" style="padding-bottom:84px"><div class="chips" style="margin-bottom:36px"><a class="chip ${topic?'':'on'}" href="#/episodes">All</a>${C.topics.map(t=>`<a class="chip ${t.name===topic?'on':''}" href="#/episodes/${encodeURIComponent(t.name)}">${esc(t.name)}</a>`).join('')}</div>
  ${list.length?list.map(row).join(''):'<p class="ph">No episodes on this topic yet.</p>'}</div>`;
}
function episode(slug){
  const e = EP.find(x=>x.slug===slug); if(!e) return episodes();
  const rel = EP.filter(x=>x!==e && x.topics.some(t=>e.topics.includes(t))).slice(0,3);
  return `<div class="wrap page-h ep-h"><a class="eyebrow" href="#/episodes">← All episodes</a><div class="eyebrow w" style="margin-top:28px">Episode ${e.n} · ${fmt(e.date)}</div><h1>${esc(e.full)}</h1>
  <div class="tag" style="font-size:24px;max-width:680px">${esc(e.desc)}</div></div>
  <div class="wrap" style="padding-bottom:84px"><div class="player"><div class="eyebrow">Listen</div>
  ${e.audio?`<audio controls src="${esc(e.audio)}"></audio>`:'<p class="ph" style="margin:12px 0 0">Audio coming soon. Use the listen button below.</p>'}
  ${btns(e)}</div>
  <div class="ep-cols"><div class="transcript"><div class="eyebrow">Transcript</div>${e.tr.length?e.tr.map(t=>`${t[0]?`<b>${esc(t[0])}</b>`:''}<p>${esc(t[1]).replace(/\n/g,'<br>')}</p>`).join(''):'<p class="ph">Transcript coming soon.</p>'}</div>
  <aside class="side">${e.artwork?`<div><img class="art" src="${esc(e.artwork)}" alt="${esc(e.title)}"></div>`:''}<div><h4>In conversation</h4>${e.people.map(esc).join('<br>')}</div>
  <div><h4>Topics</h4><div class="chips">${e.topics.map(t=>`<a class="chip" href="#/episodes/${encodeURIComponent(t)}">${esc(t)}</a>`).join('')}</div></div>
  <div><h4>Related episodes</h4>${rel.length?rel.map(r=>`<a href="#/episode/${r.slug}" style="display:block;margin-bottom:14px;font:500 22px/1.15 var(--serif)">${r.n} — ${esc(r.title)}</a>`).join(''):'<span class="ph">More coming soon.</span>'}</div></aside></div></div>`;
}
function about(){
  const PG = C.pages;
  return `<div class="wrap page-h"><div class="eyebrow">About</div><h1>About</h1></div>
  <div class="wrap about2" style="padding-bottom:84px"><div class="pull">${esc(PG.aboutPull)}</div>
  <div class="prose"><div class="eyebrow" style="margin-bottom:12px">What it is</div><p>${esc(PG.aboutWhat)}</p>

  <div class="wrap hostlist" style="padding-bottom:84px">${C.hosts.map(h=>`<div class="h"><div class="arch">${h.photo?`<img src="${esc(h.photo)}" alt="${esc(h.name)}">`:esc((h.name||'?')[0])}</div><div><h2 style="font-size:56px">${esc(h.name)}</h2><div class="eyebrow" style="margin:12px 0 20px">${esc(h.role)}</div><div class="prose"><p>${esc(h.bio)}</p></div></div></div>`).join('')}</div>`;

function footerHTML(){
  const S = C.show, L = [['Spotify',S.spotify],['Apple Podcasts',S.apple],['YouTube',S.youtube]], F = [['Instagram',S.instagram],['TikTok',S.tiktok],['X / Twitter',S.x]];
  const ls = a => a.filter(x=>x[1]).map(x=>`<a href="${lnk(x[1])}">${x[0]}</a>`).join('');

}
function route(){
  const [p,a] = location.hash.replace('#/','').split('/');
  derive();
  const main = document.getElementById('mainview');
  const topic = a ? decodeURIComponent(a) : '';
  main.innerHTML = p==='episodes'?episodes(topic):p==='episode'?episode(a):p==='about'?about():p==='hosts'?hosts():home();
  document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('on',x.dataset.p===(p==='episode'?'episodes':(p||'home'))));
  const cur = EP.find(x=>x.slug===a);
  document.title = (p==='episode'&&cur?cur.title+' — ':'')+(C.show.title||'');
  if(p!=='edit') window.scrollTo(0,0);
  paintEditor();
}
function renderAll(){ shell(); route(); }

/* ---------------- editor ---------------- */
function getPath(p){ return p.split('.').reduce((o,k)=>o==null?o:o[k],C); }
function setPath(p,v){ const k=p.split('.'); let o=C; for(let i=0;i<k.length-1;i++) o=o[k[i]]; o[k[k.length-1]]=v; }
function touch(){ dirty = true; saveDraft(); }
function saveDraft(){ try{ localStorage.setItem('akip-draft',JSON.stringify(C)); }catch(e){} }
function clearDraft(){ try{ localStorage.removeItem('akip-draft'); }catch(e){} }
function toast(msg){ const ui=document.getElementById('ui'); if(!ui) return; let t=ui.querySelector('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); ui.appendChild(t); } t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>{ if(t.parentNode) t.parentNode.removeChild(t); },6000); }
function pageMB(){ try{ return new Blob([JSON.stringify(C)]).size/1048576; }catch(e){ return 0; } }

const fld = (lab,path,val,o)=>{ o=o||{}; const k=o.k?` data-k="${o.k}"`:''; const v=o.k==='list'?(val||[]).join(', '):val;
  return `<label class="fl"><span>${esc(lab)}</span>${o.rows?`<textarea rows="${o.rows}" data-p="${path}"${k}>${esc(v)}</textarea>`:`<input type="${o.type||'text'}" value="${esc(v)}" data-p="${path}"${k}${o.type==='text'||!o.type?' autocomplete="off"':''}>`}${o.hint?`<small>${esc(o.hint)}</small>`:''}</label>`; };
const upl = (lab,path,val,kind,hint)=>{
  const has = !!val, isData = has && String(val).indexOf('data:')===0;
  let cur = '';
  if(kind==='image' && has) cur = `<img src="${esc(val)}" alt="">`;
  if(kind==='audio' && isData) cur = `<small style="margin:0 0 10px">Uploaded audio file (${(val.length*0.75/1048576).toFixed(1)} MB)</small>`;
  const link = (kind==='audio' && !isData) ? `<input type="text" value="${esc(val||'')}" data-p="${path}" placeholder="https://… (link to an .mp3 file)" autocomplete="off" style="margin-bottom:10px">` : '';
  return `<div class="fl"><span>${esc(lab)}</span>${cur}${link}<input type="file" accept="${kind==='image'?'image/*':'audio/*'}" data-up="${path}" data-kind="${kind}">${has&&(kind==='image'||isData)?`<div class="acts"><button class="chip" type="button" data-act="clearfield" data-p="${path}">Remove</button></div>`:''}${hint?`<small>${esc(hint)}</small>`:''}</div>`; };

function epCard(e,i){
  const p = 'episodes.'+i+'.';
  const tn = C.topics.map(t=>`<label class="chk"><input type="checkbox" data-k="topicchk" data-ep="${i}" data-name="${esc(t.name)}" ${(e.topics||[]).includes(t.name)?'checked':''}><span>${esc(t.name)}</span></label>`).join('');
  return `<details class="card" data-id="${esc(e.id)}" ${e.id===openEp?'open':''}><summary>${esc(e.title||'Untitled episode')}<small>${esc(e.date||'')}</small></summary>
  ${fld('Title',p+'title',e.title,{hint:'An episode needs a title and a date to appear on the site.'})}
  ${fld('Full title (optional)',p+'full',e.full,{hint:'Shown as the headline on the episode page. Leave empty to reuse the title.'})}
  ${fld('Date',p+'date',e.date,{type:'date'})}
  ${fld('Description',p+'desc',e.desc,{rows:3})}
  ${fld('People / guests',p+'people',e.people,{k:'list',hint:'Separate names with commas.'})}
  <div class="fl"><span>Topics</span>${tn||'<small>Add topics on the Topics tab first.</small>'}</div>
  ${fld('Listen link',p+'listen',e.listen,{hint:'Spotify, Apple or any link for the Listen now button. Empty uses the main Spotify link.'})}
  ${fld('Watch link',p+'watch',e.watch)}
  ${upl('Audio',p+'audio',e.audio,'audio','Paste a link to an .mp3, or upload a short file (under 8 MB). Full episodes are best linked.')}
  ${upl('Episode artwork',p+'artwork',e.artwork,'image','Shown on the home page and the episode page. Resized automatically.')}
  ${fld('Transcript',p+'transcript',e.transcript,{rows:10,hint:'Separate paragraphs with a blank line. Start a paragraph with "Name:" to show a speaker label.'})}
  <div class="acts"><button class="chip danger" type="button" data-act="delep" data-i="${i}" data-confirm="1">Remove episode</button></div></details>`;
}
function panel(){
  if(tab==='show'){ const S='show.';
    return `<h2>Show</h2><p class="lead">The title, tagline, links and contact details.</p>
    ${fld('Podcast title',S+'title',C.show.title)}${fld('Italic word in the title',S+'accent',C.show.accent,{hint:'One word of the title that is shown in italics, such as "in". Leave empty for none.'})}
    ${fld('Tagline',S+'tagline',C.show.tagline)}${fld('Introduction',S+'intro',C.show.intro,{rows:3})}${fld('Footer text',S+'footerBlurb',C.show.footerBlurb,{rows:2})}
    ${fld('Email',S+'email',C.show.email)}
    ${fld('Spotify link',S+'spotify',C.show.spotify)}${fld('Apple Podcasts link',S+'apple',C.show.apple)}${fld('YouTube link',S+'youtube',C.show.youtube)}
    ${fld('Instagram link',S+'instagram',C.show.instagram)}${fld('TikTok link',S+'tiktok',C.show.tiktok)}${fld('X / Twitter link',S+'x',C.show.x)}
    <p class="note">Page size: ${pageMB().toFixed(1)} MB of 16 MB. Images are shrunk automatically, so you will rarely get close.</p>`; }
  if(tab==='about'){ const P='pages.', g=C.pages;
    return `<h2>About</h2><p class="lead">The text on the home page About section and the About page.</p>
    ${fld('Home heading',P+'homeAboutHeading',g.homeAboutHeading)}${fld('Home heading, italic ending',P+'homeAboutItalic',g.homeAboutItalic)}
    ${fld('Home paragraph 1',P+'homeAboutP1',g.homeAboutP1,{rows:3})}${fld('Home paragraph 2',P+'homeAboutP2',g.homeAboutP2,{rows:3})}
    ${fld('About page: pull quote',P+'aboutPull',g.aboutPull,{rows:2})}${fld('What it is',P+'aboutWhat',g.aboutWhat,{rows:4})}
    ${fld('Why we made it',P+'aboutWhy',g.aboutWhy,{rows:4})}${fld('What we talk about',P+'aboutTalk',g.aboutTalk,{rows:4})}${fld("Who it's for",P+'aboutFor',g.aboutFor,{rows:4})}`; }
  if(tab==='topics'){
    return `<h2>Topics</h2><p class="lead">Topics appear on the home page and as filters on the Episodes page. Renaming a topic updates your episodes.</p>
    ${C.topics.map((t,i)=>`<div class="card"><label class="fl"><span>Topic name</span><input type="text" value="${esc(t.name)}" data-k="tname" data-old="${esc(t.name)}" autocomplete="off"></label>
    ${fld('Short description','topics.'+i+'.desc',t.desc)}<div class="acts"><button class="chip danger" type="button" data-act="deltopic" data-i="${i}" data-confirm="1">Remove topic</button></div></div>`).join('')}
    <div class="acts"><button class="btn sm" type="button" data-act="addtopic">Add a topic</button></div>`; }
  if(tab==='hosts'){
    return `<h2>Hosts</h2><p class="lead">Names, roles, biographies and photos.</p>
    ${C.hosts.map((h,i)=>`<div class="card">${fld('Name','hosts.'+i+'.name',h.name)}${fld('Role','hosts.'+i+'.role',h.role)}${fld('Biography','hosts.'+i+'.bio',h.bio,{rows:4})}
    ${upl('Photo','hosts.'+i+'.photo',h.photo,'image','A portrait works best. It is cropped to the arch shape.')}
    <div class="acts"><button class="chip" type="button" data-act="hostup" data-i="${i}">Move up</button><button class="chip" type="button" data-act="hostdown" data-i="${i}">Move down</button><button class="chip danger" type="button" data-act="delhost" data-i="${i}" data-confirm="1">Remove host</button></div></div>`).join('')}
    <div class="acts"><button class="btn sm" type="button" data-act="addhost">Add a host</button></div>`; }
  const order = C.episodes.map((e,i)=>[e,i]).sort((a,b)=>String(b[0].date).localeCompare(String(a[0].date)));
  return `<h2>Episodes</h2><p class="lead">Newest first. Tap an episode to edit it. Numbers are assigned automatically by date.</p>
  ${order.map(x=>epCard(x[0],x[1])).join('')}<div class="acts"><button class="btn sm" type="button" data-act="addep">Add an episode</button></div>`;
}
function edHTML(){
  const tabs=[['show','Show'],['about','About'],['topics','Topics'],['hosts','Hosts'],['episodes','Episodes']];
  return `<div class="edtop"><div class="tabs">${tabs.map(t=>`<button class="chip ${t[0]===tab?'on':''}" type="button" data-act="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>
  <div class="tabs"><button class="chip" type="button" data-act="preview">Preview</button><button class="btn fill sm" type="button" data-act="publish">Publish</button></div></div><div class="edbody">${panel()}</div>`;
}
function redraw(){ const ed=document.getElementById('ed'); const s=ed.scrollTop; ed.innerHTML=edHTML(); ed.scrollTop=s; }
function paintEditor(){
  const ed = document.getElementById('ed'), ui = document.getElementById('ui'); if(!ed||!ui) return;
  const old = ui.querySelector('.toast');
  let h = '';
  if(canEdit && mode==='edit'){ ed.hidden=false; document.body.style.overflow='hidden'; redraw(); }
  else { ed.hidden=true; document.body.style.overflow=''; }
  if(canEdit && mode!=='edit'){
    h = dirty ? `<div class="bar"><div class="eyebrow">Previewing unpublished changes</div><button class="chip" type="button" data-act="edit">Keep editing</button><button class="btn fill sm" type="button" data-act="publish">Publish</button><button class="chip danger" type="button" data-act="discard" data-confirm="1">Discard changes</button></div>`
              : `<button class="btn fab sm" type="button" data-act="edit">Edit site</button>`;
  }
  ui.innerHTML = h; if(old) ui.appendChild(old);
}

function shrink(file,max,q){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{ let w=img.naturalWidth,h=img.naturalHeight; const s=Math.min(1,max/Math.max(w,h)); w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s));
    const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.fillStyle='#141211'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q)); };
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('That file could not be read as an image.')); }; img.src=url; }); }
function readData(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('That file could not be read.')); r.readAsDataURL(file); }); }

function bindEditor(){
  const ed = document.getElementById('ed'), ui = document.getElementById('ui');
  ed.addEventListener('toggle',ev=>{ if(ev.target.tagName==='DETAILS'&&ev.target.open) openEp=ev.target.dataset.id; },true);
  ed.addEventListener('input',e=>{ const t=e.target, p=t.dataset.p; if(!p||t.type==='file'||t.type==='checkbox') return;
    let v=t.value; if(t.dataset.k==='list') v=v.split(',').map(s=>s.trim()).filter(Boolean); setPath(p,v); touch(); });
  ed.addEventListener('change',async e=>{ const t=e.target;
    if(t.dataset.k==='tname'){ const old=t.dataset.old, nu=t.value.trim(); if(!nu||nu===old){ t.value=old; return; }
      if(C.topics.some(x=>x.name===nu)){ toast('You already have a topic with that name.'); t.value=old; return; }
      C.topics.forEach(x=>{ if(x.name===old) x.name=nu; }); C.episodes.forEach(ep=>{ ep.topics=(ep.topics||[]).map(x=>x===old?nu:x); }); t.dataset.old=nu; touch(); return; }
    if(t.dataset.k==='topicchk'){ const ep=C.episodes[+t.dataset.ep], n=t.dataset.name; ep.topics=(ep.topics||[]).filter(x=>x!==n); if(t.checked) ep.topics.push(n); touch(); return; }
    if(t.type==='file'&&t.files&&t.files[0]){ const f=t.files[0], path=t.dataset.up;
      try{
        if(t.dataset.kind==='image'){ toast('Processing image…'); setPath(path, await shrink(f, /photo$/.test(path)?800:1200, .82)); }
        else { if(f.size>8*1048576){ toast('That audio file is '+(f.size/1048576).toFixed(1)+' MB. Upload limit is 8 MB, so paste a link to it instead.'); t.value=''; return; } toast('Reading audio…'); setPath(path, await readData(f)); }
        if(pageMB()>14){ toast('The page is getting too large ('+pageMB().toFixed(1)+' MB of 16 MB). Remove some images or audio.'); }
        else toast('Added');
        touch(); redraw();
      }catch(err){ toast(err.message||'Upload failed.'); }
    } });
}
const armed = new WeakSet();
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return; const act=t.dataset.act, i=+t.dataset.i;
  if(t.dataset.confirm && !armed.has(t)){ armed.add(t); const o=t.textContent; t.textContent='Tap again to confirm'; setTimeout(()=>{ armed.delete(t); t.textContent=o; },3500); return; }
  if(act==='tab'){ tab=t.dataset.v; redraw(); document.getElementById('ed').scrollTop=0; }
  else if(act==='edit'){ mode='edit'; paintEditor(); }
  else if(act==='preview'){ mode='site'; renderAll(); }
  else if(act==='discard'){ C=JSON.parse(JSON.stringify(DATA)); dirty=false; clearDraft(); mode='site'; renderAll(); toast('Changes discarded'); }
  else if(act==='publish'){ publish(); }
  else if(act==='clearfield'){ setPath(t.dataset.p,''); touch(); redraw(); }
  else if(act==='addtopic'){ C.topics.push({name:'New topic',desc:''}); touch(); redraw(); }
  else if(act==='deltopic'){ const n=C.topics[i].name; C.topics.splice(i,1); C.episodes.forEach(ep=>{ ep.topics=(ep.topics||[]).filter(x=>x!==n); }); touch(); redraw(); }
  else if(act==='addhost'){ C.hosts.push({name:'New host',role:'Host',bio:'',photo:''}); touch(); redraw(); }
  else if(act==='delhost'){ C.hosts.splice(i,1); touch(); redraw(); }
  else if(act==='hostup'&&i>0){ const h=C.hosts.splice(i,1)[0]; C.hosts.splice(i-1,0,h); touch(); redraw(); }
  else if(act==='hostdown'&&i<C.hosts.length-1){ const h=C.hosts.splice(i,1)[0]; C.hosts.splice(i+1,0,h); touch(); redraw(); }
  else if(act==='addep'){ const id='e'+Date.now().toString(36); C.episodes.push({id:id,title:'New episode',full:'',date:today(),desc:'',people:[],topics:[],listen:'',watch:'',audio:'',artwork:'',transcript:''}); openEp=id; touch(); redraw(); }
  else if(act==='delep'){ C.episodes.splice(i,1); touch(); redraw(); }
});

function buildDoc(){
  const reset = Array.prototype.map.call(document.head.querySelectorAll('style'),s=>s).filter(s=>s.id!=='design')[0];
  const json = JSON.stringify(C).replace(/</g,'\\u003c');
  const title = ((C.show.title||'Podcast')+' — A student podcast').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const links = Array.prototype.map.call(document.querySelectorAll('link[data-keep]'),l=>l.outerHTML).join('');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+(reset?reset.textContent:'')+'</style></head><body>'
    +'<title>'+title+'</title>'+links
    +'<style id="design">'+document.getElementById('design').textContent+'</style>'
    +'<div id="root"></div>'
    +'<script type="application/json" id="content">'+json+'<\/script>'
    +'<script id="app">'+document.getElementById('app').textContent+'<\/script>'
    +'</body></html>';
}
function msgFor(err){
  const c = err && err.code;
  if(c==='conflict') return 'Someone published a newer version first. Your edits are kept as a draft. Reload this page, then publish again.';
  if(c==='not_writer'||c==='not_granted') return 'Only the site owner can publish. Open the site from your own account.';
  return (err&&err.message)||'Publishing failed. Your edits are kept as a draft.';
}
async function publish(){
  if(busy) return; busy=true;
  try{
    const art = (window.claude && window.claude.use) ? await window.claude.use('artifact') : null;
    if(!art){ toast('Publishing is not available in this view. Open the published site and try again.'); busy=false; return; }
    const html = buildDoc(), mb = new Blob([html]).size/1048576;
    if(mb>15.5){ toast('The page is '+mb.toFixed(1)+' MB and the limit is 16 MB. Remove some images or audio.'); busy=false; return; }
    toast('Publishing…'); clearDraft();
    await art.publish(html);
    dirty=false; toast('Published'); busy=false;
  }catch(err){ saveDraft(); toast(msgFor(err)); busy=false; }
}

/* ---------------- start ---------------- */
if(location.hash==='#/edit'){ canEdit=true; mode='edit'; try{ history.replaceState(null,'','#/'); }catch(e){} }
renderAll();
window.addEventListener('hashchange',route);
(async function(){
  try{
    const u = (window.claude && window.claude.use) ? await window.claude.use('user') : null;
    if(u){ const ok = (u.canEdit && await u.canEdit()) || (u.isOwner && await u.isOwner()); if(ok) canEdit = true; }
  }catch(e){}
  if(canEdit){
    try{ const d = localStorage.getItem('akip-draft'); if(d && d!==JSON.stringify(DATA)){ C=JSON.parse(d); dirty=true; toast('Restored your unpublished edits'); } }catch(e){}
    renderAll();
  }
})();
})();
</script></body></html>
